[build]
  # Skip auto-build when only links.yaml changed (radar API commits).
  # Build hooks bypass this, so the nightly scheduled build still works.
  ignore = "bash netlify-ignore.sh"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/add-link"
  to = "/.netlify/functions/add-link"
  status = 200

[[redirects]]
  from = "/api/fetch-og"
  to = "/.netlify/functions/fetch-og"
  status = 200

# Tools hosted elsewhere, proxied under tuhinanshu.com/tools/*
[[redirects]]
  from = "/tools/guid/*"
  to = "https://rajadain.github.io/guid/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/tools/proposal-ledger/*"
  to = "https://rajadain.github.io/proposal-ledger/:splat"
  status = 200
  force = true
